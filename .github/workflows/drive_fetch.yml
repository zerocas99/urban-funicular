name: Fetch URL (file/HLS) -> Google Drive

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Direct file URL or .m3u8 URL"
        required: true
        type: string
      out_name:
        description: "Optional output name (for .m3u8 лучше .mp4). Example: episode4.mp4"
        required: false
        type: string

jobs:
  fetch_and_upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (ffmpeg)
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-httplib2 httplib2

      - name: Download / Build output
        id: dl
        env:
          URL: ${{ inputs.url }}
          OUT_NAME: ${{ inputs.out_name }}
        run: |
          set -e

          FILE="${OUT_NAME}"

          # If user didn't pass out_name: choose safe defaults
          if [ -z "$FILE" ]; then
            if echo "$URL" | grep -qiE '\.m3u8($|\?)'; then
              FILE="output.mp4"
            else
              FILE="output.bin"
            fi
          fi

          echo "Will save as: $FILE"
          python tools/fetch.py "$URL" "$FILE"

          # expose for next steps
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Upload to Google Drive
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          FILE: ${{ steps.dl.outputs.file }}
        run: |
          set -e
          echo "Uploading: $FILE"
          python tools/upload_drive.py "$FILE"

      # Optional: also keep a copy as GitHub Actions artifact (useful for debugging)
      - name: Upload artifact (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetched-file
          path: |
            ${{ steps.dl.outputs.file }}
          if-no-files-found: ignore
